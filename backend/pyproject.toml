[project]
name = "document-qa-backend"
version = "0.1.0"
description = "Backend API and AI workflow for Document Q&A"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.141.1,<1.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "uvicorn[standard]>=0.53.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1,<3.0.0",
  "mypy>=1.19.1,<2.0.0",
  "pytest>=9.0.2,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.15.7,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.29.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
