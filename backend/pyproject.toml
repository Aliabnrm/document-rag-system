[project]
name = "document-qa-backend"
version = "0.1.0"
description = "Backend API and AI workflow for Document Q&A"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.20.0,<2.0.0",
  "boto3>=1.40,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.141.1,<1.0.0",
  "httpx>=0.28,<1",
  "pgvector>=0.5.0,<1.0.0",
  "psycopg[binary]>=3.3.6,<4.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.54,<3.0.0",
  "uvicorn[standard]>=0.53.0,<1.0.0",
]

[project.optional-dependencies]
models = [
    "fastembed>=0.7,<1",
    "huggingface-hub>=1.4,<2",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1,<3.0.0",
  "mypy>=1.19.1,<2.0.0",
  "pytest>=9.0.2,<10.0.0",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.15.7,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.29.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
